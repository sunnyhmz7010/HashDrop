name: Docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# 同一镜像串行发布，避免并发改写 latest。
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 确定镜像地址
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: 构建待验证镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tinyfaka:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证初始化、健康检查、备份与重启
        shell: bash
        run: |
          set -euo pipefail
          container="tinyfaka-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config_volume="$container-config"
          data_volume="$container-data"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$config_volume" "$data_volume" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$config_volume:/etc/tinyfaka" \
            -v "$data_volume:/var/lib/tinyfaka" tinyfaka:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:8080/api/setup/status | grep -q '"initialized":false'
          docker exec "$container" tinyfaka -healthcheck -config /etc/tinyfaka/config.json
          setup_token=$(docker logs "$container" | python3 -c 'import json,sys; print(next(row["setup_token"] for row in map(json.loads,sys.stdin) if "setup_token" in row))')
          curl --fail --silent --show-error http://127.0.0.1:8080/api/setup \
            -H 'Origin: http://127.0.0.1:8080' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $setup_token" \
            --data '{"title":"Docker smoke","public_url":"http://127.0.0.1:8080","password":"docker-smoke-password-only","password_confirm":"docker-smoke-password-only","manual_policy":"hold"}' \
            | grep -q '"initialized":true'
          unset setup_token
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '/assets/'
          docker exec "$container" tinyfaka -healthcheck -config /etc/tinyfaka/config.json
          docker exec "$container" tinyfaka -config /etc/tinyfaka/config.json \
            -backup /var/lib/tinyfaka/ci-backup.db
          docker exec "$container" test -s /var/lib/tinyfaka/ci-backup.db
          docker restart "$container"
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:8080/api/setup/status | grep -q '"initialized":true'
          docker exec "$container" tinyfaka -healthcheck -config /etc/tinyfaka/config.json

      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布 amd64 与 arm64 镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
