services:
  tinyfaka:
    image: ghcr.io/sunnyhmz7010/tinyfaka:latest
    container_name: tinyfaka
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tinyfaka_config:/etc/tinyfaka
      - tinyfaka_data:/var/lib/tinyfaka
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tinyfaka_config:
  tinyfaka_data:
